[workspace]
members = ["programs/groundgraph", "tests"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"
license = "MIT"

# Size matters: devnet deploy rent is paid from faucet airdrops, and mainnet rent scales with program size.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
overflow-checks = true
panic = "abort"
strip = false

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Tests run the compiled .so inside LiteSVM, but host-side math and proptest benefit from some optimization.
[profile.test]
opt-level = 1
